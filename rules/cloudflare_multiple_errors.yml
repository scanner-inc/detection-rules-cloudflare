# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Cloudflare Multiple Error Requests from Single IP
description: |-
  Detect when a single IP address generates a high volume of error responses,
  which may indicate scanning, enumeration, or attack attempts.
severity: Low
query_text: |-
  @scnr.source_type:"cloudflare:http"
  ClientRequestMethod:GET
  EdgeResponseStatus >= 400
  | groupbycount(ClientIP)
  | where @q.count > 100
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1190.exploit_public_facing_application
- techniques.t1133.external_remote_services
- source.cloudflare
tests:
  - name: No alert when error count is below threshold
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientRequestMethod": "GET", "EdgeResponseStatus": 404, "ClientIP": "1.2.3.4"}
    expected_detection_result: false
  - name: No alert for successful GET responses
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientRequestMethod": "GET", "EdgeResponseStatus": 200, "ClientIP": "1.2.3.4"}
    expected_detection_result: false
