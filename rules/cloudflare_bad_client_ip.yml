# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Cloudflare Bad Client IP
description: |-
  Detect requests from IP addresses that have been classified as having a bad reputation,
  including unknown, badHost, greylist, securityScanner, scan, or tor classifications.
severity: Medium
query_text: |-
  @scnr.source_type:"cloudflare:http"
  ClientIPClass:(unknown badHost greylist securityScanner scan tor)
  | groupbycount(ClientIP)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1190.exploit_public_facing_application
- techniques.t1133.external_remote_services
- source.cloudflare
tests:
  - name: Alert triggered for tor client IP class
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientIPClass": "tor", "ClientIP": "1.2.3.4"}
    expected_detection_result: true
  - name: Alert triggered for securityScanner client IP class
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientIPClass": "securityScanner", "ClientIP": "5.6.7.8"}
    expected_detection_result: true
  - name: No alert for clean client IP class
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientIPClass": "clearlyGood", "ClientIP": "9.9.9.9"}
    expected_detection_result: false
  - name: No alert for cloudflare DNS logs
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:dns", "QueryName": "example.com", "QueryType": "A"}
    expected_detection_result: false
