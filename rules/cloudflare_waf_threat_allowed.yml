# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Cloudflare WAF Allowed Threat
description: |-
  Detect when Cloudflare's Web Application Firewall (WAF) detects
  a threat but takes an "Allow" action instead of blocking it,
  which may indicate a misconfiguration or bypass attempt.
severity: High
query_text: |-
  @scnr.source_type:"cloudflare:http"
  (WAFRuleID:* or WAFRuleMessage:*)
  WAFAction:Allow
  | groupbycount(ClientIP)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- high_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1190.exploit_public_facing_application
- techniques.t1133.external_remote_services
- source.cloudflare
tests:
  - name: Alert triggered when a WAF rule matches but the action is Allow
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "WAFRuleID": "100015", "WAFRuleMessage": "SQL Injection", "WAFAction": "Allow", "ClientIP": "1.2.3.4"}
    expected_detection_result: true
  - name: No alert when the WAF action blocks the threat
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "WAFRuleID": "100015", "WAFRuleMessage": "SQL Injection", "WAFAction": "Block", "ClientIP": "1.2.3.4"}
    expected_detection_result: false
