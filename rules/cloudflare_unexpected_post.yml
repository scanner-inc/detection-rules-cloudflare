# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Cloudflare Unexpected POST Requests
description: |-
  Detect POST or PUT requests to URIs that typically don't accept
  POST/PUT requests, which may indicate file upload attempts, web
  shell activity, or other malicious file operations.
severity: Medium
query_text: |-
  @scnr.source_type:"cloudflare:http"
  ClientRequestMethod:(POST PUT)
  ClientRequestURI:(".jpg" ".jpeg" ".gif" ".png" ".icon" ".ico" ".xml" ".swf" ".svg" ".ppt" ".pttx" ".doc" ".docx" ".rtf" ".pdf" ".tif" ".zip" ".mov")
  | groupbycount(ClientIP)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0003.persistence
- tactics.ta0011.command_and_control
- techniques.t1505.server_software_component
- techniques.t1071.application_layer_protocol
- source.cloudflare
tests:
  - name: Alert triggered for a POST to a static image asset
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientRequestMethod": "POST", "ClientRequestURI": "/assets/photo.jpg", "ClientIP": "1.2.3.4"}
    expected_detection_result: true
  - name: No alert for a GET to a static image asset
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientRequestMethod": "GET", "ClientRequestURI": "/assets/photo.jpg", "ClientIP": "1.2.3.4"}
    expected_detection_result: false
  - name: No alert for a POST to a normal API path
    now_timestamp: "2026-06-08T00:03:00.000Z"
    dataset_inline: |
      {"timestamp": "2026-06-08T00:02:30.000Z", "@scnr.source_type": "cloudflare:http", "ClientRequestMethod": "POST", "ClientRequestURI": "/api/v1/orders", "ClientIP": "1.2.3.4"}
    expected_detection_result: false
